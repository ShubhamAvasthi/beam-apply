<!doctype html>
<!--
  PLACEHOLDER FIXTURE — hand-written, not captured from any real page.

  An approximation of a Greenhouse job-board application form, written from
  the platform's public markup conventions so the test setup can run before
  a real-page-derived fixture exists. Replace this file with that fixture;
  the tests can also run against any saved page without replacing it:

    BEAMAPPLY_FIXTURE=/path/to/page.html bun run test

  Structural assumptions encoded here (the ones the adapter depends on):
  - Standard fields are <input>s with fixed ids: first_name, last_name,
    email, phone; file uploads are input[type=file] with ids resume and
    cover_letter.
  - Country and location are react-select comboboxes: an
    input[role=combobox] (ids country, candidate-location) inside a
    .select__control shell. Their option menus only exist while open, so
    a static page contains none.
  - Every question is a <label for="…"> pointing at its control's id;
    requisition-specific questions use ids like question_<number>.

  No company names, job content or tracking markup. Keep it that way.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Software Engineer at Example Co</title>
  </head>
  <body>
    <main class="job-post">
      <h1 class="section-header">Software Engineer</h1>

      <form id="application-form" class="application--form">
        <div class="application--questions">
          <div class="text-input-wrapper">
            <div class="input-wrapper">
              <label id="first_name-label" for="first_name" class="label">
                First Name<span aria-hidden="true">*</span>
              </label>
              <input
                id="first_name"
                class="input input__single-line"
                type="text"
                maxlength="255"
                autocomplete="given-name"
                aria-required="true"
                value=""
              />
            </div>
          </div>

          <div class="text-input-wrapper">
            <div class="input-wrapper">
              <label id="last_name-label" for="last_name" class="label">
                Last Name<span aria-hidden="true">*</span>
              </label>
              <input
                id="last_name"
                class="input input__single-line"
                type="text"
                maxlength="255"
                autocomplete="family-name"
                aria-required="true"
                value=""
              />
            </div>
          </div>

          <div class="text-input-wrapper">
            <div class="input-wrapper">
              <label id="preferred_name-label" for="preferred_name" class="label">
                Preferred First Name
              </label>
              <input
                id="preferred_name"
                class="input input__single-line"
                type="text"
                maxlength="255"
                value=""
              />
            </div>
          </div>

          <div class="text-input-wrapper">
            <div class="input-wrapper">
              <label id="email-label" for="email" class="label">
                Email<span aria-hidden="true">*</span>
              </label>
              <input
                id="email"
                class="input input__single-line"
                type="email"
                maxlength="255"
                autocomplete="email"
                aria-required="true"
                value=""
              />
            </div>
          </div>

          <div class="phone-input">
            <div class="phone-input__country">
              <div class="select">
                <div class="select__container">
                  <label id="country-label" for="country" class="label select__label">
                    Country<span aria-hidden="true">*</span>
                  </label>
                  <div class="select-shell">
                    <div class="select__control">
                      <div class="select__value-container">
                        <div class="select__placeholder" id="react-select-country-placeholder">
                          Select...
                        </div>
                        <div class="select__input-container" data-value="">
                          <input
                            id="country"
                            class="select__input"
                            type="text"
                            role="combobox"
                            autocomplete="off"
                            aria-autocomplete="list"
                            aria-expanded="false"
                            aria-haspopup="true"
                            aria-labelledby="country-label"
                            aria-required="true"
                            value=""
                          />
                        </div>
                      </div>
                      <div class="select__indicators">
                        <button type="button" class="icon-button" aria-label="Toggle flyout"></button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="input-wrapper">
              <label id="phone-label" for="phone" class="label">
                Phone<span aria-hidden="true">*</span>
              </label>
              <input
                id="phone"
                class="input input__single-line iti__tel-input"
                type="tel"
                maxlength="255"
                autocomplete="tel"
                aria-required="true"
                value=""
              />
            </div>
          </div>

          <div class="select">
            <div class="select__container">
              <label
                id="candidate-location-label"
                for="candidate-location"
                class="label select__label"
              >
                Location (City)<span aria-hidden="true">*</span>
              </label>
              <div class="select-shell">
                <div class="select__control">
                  <div class="select__value-container">
                    <div class="select__placeholder">Select...</div>
                    <div class="select__input-container" data-value="">
                      <input
                        id="candidate-location"
                        class="select__input"
                        type="text"
                        role="combobox"
                        autocomplete="off"
                        aria-autocomplete="list"
                        aria-expanded="false"
                        aria-haspopup="true"
                        aria-labelledby="candidate-location-label"
                        aria-required="true"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="file-upload" role="group" aria-labelledby="upload-label-resume">
            <div class="label upload-label" id="upload-label-resume">
              Resume/CV<span aria-hidden="true">*</span>
            </div>
            <div class="file-upload__wrapper">
              <button type="button" class="btn btn--pill">Attach</button>
              <button type="button" class="btn btn--pill">Enter manually</button>
              <input
                id="resume"
                class="visually-hidden"
                type="file"
                accept=".pdf,.doc,.docx,.txt,.rtf"
              />
            </div>
          </div>

          <div class="file-upload" role="group" aria-labelledby="upload-label-cover_letter">
            <div class="label upload-label" id="upload-label-cover_letter">
              Cover Letter
            </div>
            <div class="file-upload__wrapper">
              <button type="button" class="btn btn--pill">Attach</button>
              <input
                id="cover_letter"
                class="visually-hidden"
                type="file"
                accept=".pdf,.doc,.docx,.txt,.rtf"
              />
            </div>
          </div>

          <div class="text-input-wrapper">
            <div class="input-wrapper">
              <label id="question_1000001-label" for="question_1000001" class="label">
                LinkedIn Profile
              </label>
              <input
                id="question_1000001"
                class="input input__single-line"
                type="text"
                maxlength="255"
                value=""
              />
            </div>
          </div>

          <div class="text-input-wrapper">
            <div class="input-wrapper">
              <label id="question_1000002-label" for="question_1000002" class="label">
                Website
              </label>
              <input
                id="question_1000002"
                class="input input__single-line"
                type="text"
                maxlength="255"
                value=""
              />
            </div>
          </div>

          <div class="select">
            <div class="select__container">
              <label id="question_1000003-label" for="question_1000003" class="label select__label">
                Will you now or in the future require immigration sponsorship for employment?<span
                  aria-hidden="true"
                  >*</span
                >
              </label>
              <div class="select-shell">
                <div class="select__control">
                  <div class="select__value-container">
                    <div class="select__placeholder">Select...</div>
                    <div class="select__input-container" data-value="">
                      <input
                        id="question_1000003"
                        class="select__input"
                        type="text"
                        role="combobox"
                        autocomplete="off"
                        aria-autocomplete="list"
                        aria-expanded="false"
                        aria-haspopup="true"
                        aria-labelledby="question_1000003-label"
                        aria-required="true"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="select">
            <div class="select__container">
              <label id="question_1000004-label" for="question_1000004" class="label select__label">
                Are you willing to relocate for this role?
              </label>
              <div class="select-shell">
                <div class="select__control">
                  <div class="select__value-container">
                    <div class="select__placeholder">Select...</div>
                    <div class="select__input-container" data-value="">
                      <input
                        id="question_1000004"
                        class="select__input"
                        type="text"
                        role="combobox"
                        autocomplete="off"
                        aria-autocomplete="list"
                        aria-expanded="false"
                        aria-haspopup="true"
                        aria-labelledby="question_1000004-label"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="text-input-wrapper">
            <div class="input-wrapper">
              <label id="question_1000005-label" for="question_1000005" class="label">
                How did you hear about this job?
              </label>
              <input
                id="question_1000005"
                class="input input__single-line"
                type="text"
                maxlength="255"
                value=""
              />
            </div>
          </div>

          <div class="text-input-wrapper">
            <div class="input-wrapper">
              <label id="question_1000006-label" for="question_1000006" class="label">
                Is there anything else you would like us to know?
              </label>
              <textarea id="question_1000006" class="input input__multi-line"></textarea>
            </div>
          </div>

          <div class="checkbox">
            <div class="checkbox__wrapper">
              <div class="checkbox__input">
                <input id="question_1000007_1" type="checkbox" value="1" />
              </div>
              <label for="question_1000007_1" class="checkbox__label">
                I acknowledge the applicant privacy notice
              </label>
            </div>
          </div>
        </div>

        <div class="eeoc__container">
          <div class="select">
            <div class="select__container">
              <label id="gender-label" for="gender" class="label select__label">Gender</label>
              <div class="select-shell">
                <div class="select__control">
                  <div class="select__value-container">
                    <div class="select__placeholder">Select...</div>
                    <div class="select__input-container" data-value="">
                      <input
                        id="gender"
                        class="select__input"
                        type="text"
                        role="combobox"
                        autocomplete="off"
                        aria-autocomplete="list"
                        aria-expanded="false"
                        aria-haspopup="true"
                        aria-labelledby="gender-label"
                        value=""
                      />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn--rounded">Submit application</button>
      </form>
    </main>
  </body>
</html>
