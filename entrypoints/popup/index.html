<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeamApply</title>
    <meta name="manifest.type" content="browser_action" />
    <!-- BeamApply brand accent on top of Pico's defaults -->
    <style>
      :root {
        --pico-primary: #646cff;
        --pico-primary-background: #646cff;
        --pico-primary-border: #646cff;
        --pico-primary-hover: #535bf2;
        --pico-primary-hover-background: #535bf2;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <hgroup>
        <h1>BeamApply</h1>
        <p>Your autofill profile — kept on this device only</p>
      </hgroup>

      <button id="edit-profile" type="button">Edit profile</button>

      <footer>
        <p><small>Stored in this browser’s local storage. Nothing leaves your device.</small></p>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
