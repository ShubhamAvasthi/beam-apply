<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BeamApply Profile</title>
    <!-- Open in a full tab instead of the browser's embedded options pane -->
    <meta name="manifest.open_in_tab" content="true" />
    <!-- BeamApply brand accent on top of Pico's defaults -->
    <style>
      :root {
        --pico-primary: #646cff;
        --pico-primary-background: #646cff;
        --pico-primary-border: #646cff;
        --pico-primary-hover: #535bf2;
        --pico-primary-hover-background: #535bf2;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <hgroup>
        <h1>BeamApply Profile</h1>
        <p>Your autofill profile — kept on this device only</p>
      </hgroup>

      <article>
        <form id="profile-form">
          <div class="grid">
            <label for="first-name">
              First name
              <input id="first-name" autocomplete="given-name" required />
            </label>
            <label for="last-name">
              Last name
              <input id="last-name" autocomplete="family-name" required />
            </label>
          </div>

          <p><span id="status" role="status"></span></p>
          <p><small id="saved-at">Not saved yet</small></p>

          <button type="submit">Save changes</button>
        </form>
      </article>

      <footer>
        <p><small>Stored in this browser’s local storage. Nothing leaves your device.</small></p>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
