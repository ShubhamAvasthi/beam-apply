# Shared verification pipeline used by ci.yml and release.yml so both entry
# points run byte-identical checks (the same ones AMO runs during review, plus
# a Chrome MV3 build so both store targets are compiled on every run).
# Assumes the repository is already checked out by the caller — keep cheap
# fail-fast steps (like the tag/version check) before this action.
# Changes to how BeamApply is verified go here and apply everywhere.
name: "Install, typecheck, eslint, prettier, build, web-ext lint"
description: "Install dependencies, run tsc, eslint, prettier check, build Firefox MV3 and Chrome MV3, and run web-ext lint."
runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash

    - name: Typecheck
      run: bun compile
      shell: bash

    - name: ESLint
      run: bun lint
      shell: bash

    - name: Format check
      run: bun format:check
      shell: bash

    - name: Build (Firefox MV3)
      run: bun run build:firefox
      shell: bash

    - name: Build (Chrome MV3)
      run: bun run build:chrome
      shell: bash

    - name: Lint (web-ext)
      run: bunx web-ext lint --source-dir .output/firefox-mv3
      shell: bash
