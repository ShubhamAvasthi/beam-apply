# Quality gate: every push to main and every PR runs the shared build pipeline
# (.github/actions/build) — the same checks AMO runs during review. The
# release workflow runs the identical pipeline before publishing anything, so
# a green CI mainly protects main; the tag itself is gated by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & lint (Firefox MV3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, typecheck, build, lint
        uses: ./.github/actions/build
